name: Restore App source
on:
  push:
    paths:
      - ".tmp/app.tsx.gz.b64"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify App.tsx
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .tmp/app.tsx.gz.b64 | gunzip > /tmp/App.tsx
          echo "4487c8e77068bc1ba700ba27880e8e641f38c7e036361a967452d6c02c95069a  /tmp/App.tsx" | sha256sum -c -
          mv /tmp/App.tsx src/App.tsx
          rm -rf .tmp
          rm .github/workflows/fix-app-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore App source"
          git push origin HEAD:main
